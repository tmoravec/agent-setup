services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        HOST_UID: 501
        HOST_GID: 20
        USERNAME: ${USER}
    volumes:
      - /Users/tadeas/code:/workspace
    ports:
      - "127.0.0.1:4096:4096"
    stdin_open: true
    tty: true
    environment:
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        HOST_UID: 501
        HOST_GID: 20
        USERNAME: ${USER}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4097:4097"
    volumes:
      - "/Users/tadeas/Library/Mobile Documents/iCloud~md~obsidian/Documents/Poznamky/Apify:/data"
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    restart: unless-stopped
