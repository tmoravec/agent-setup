services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
      args:
        HOST_UID: 501
        HOST_GID: 20
        USERNAME: tadeas
    volumes:
      - /Users/tadeas/code:/workspace
      - agent-opencode-data:/home/tadeas/.local/share/opencode
    ports:
      - "127.0.0.1:4096:4096"
    stdin_open: true
    tty: true
    environment:
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    restart: unless-stopped

  vault:
    build:
      context: .
      dockerfile: vault/Dockerfile
      args:
        HOST_UID: 501
        HOST_GID: 20
        USERNAME: tadeas
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4097:4097"
      # Host 4098 -> bridge 4099 -> opencode's OAuth callback on 127.0.0.1:4098.
      - "127.0.0.1:4098:4099"
    volumes:
      - "/Users/tadeas/Library/Mobile Documents/iCloud~md~obsidian/Documents/Poznamky/Apify:/data"
      - vault-opencode-data:/home/tadeas/.local/share/opencode
    environment:
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      GCAL_ACCESS_KEY: ${GCAL_ACCESS_KEY:-}
      GCAL_APPS_SCRIPT_URL: ${GCAL_APPS_SCRIPT_URL:-}
      GH_TOKEN: ${GH_TOKEN:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      SLACK_MCP_XOXC_TOKEN: ${SLACK_MCP_XOXC_TOKEN:-}
      SLACK_MCP_XOXD_TOKEN: ${SLACK_MCP_XOXD_TOKEN:-}
    restart: unless-stopped

volumes:
  agent-opencode-data:
  vault-opencode-data:
